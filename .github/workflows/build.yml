name: Build EyePair App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:     # erlaubt manuelles Starten ueber GitHub-UI

jobs:
  # ============ Android APK Build ============
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Init plattform-spezifische Templates
        # --org at.sbp  =>  applicationId "at.sbp.eye_pair_app".
        # Bewusst anders als die alte App (com.example.eye_pair_app), damit beide
        # Versionen parallel auf dem Handy installiert bleiben koennen.
        run: flutter create . --platforms=android,ios --org at.sbp --project-name=eye_pair_app

      - name: Install deps
        run: flutter pub get

      - name: Apply Android permissions + minSdk
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # xmlns:tools im manifest-Tag
          sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' $MANIFEST
          # BLE + INTERNET Permissions vor <application> einfuegen
          # (INTERNET noetig fuer Cloud-Eyes Download von GitHub-API in Release-Builds)
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s" />\
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />' $MANIFEST
          # minSdkVersion 21 (sowohl Groovy- als auch Kotlin-DSL Versionen abdecken)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          echo "=== Manifest ==="
          cat $MANIFEST

      - name: Set Android app label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="eye_pair_app"|android:label="SBP Eye Settings"|' $MANIFEST
          grep 'android:label' $MANIFEST

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: eye_pair_app-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release bei git-tag (z.B. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  # ============ iOS IPA Build (optional) ============
  # Laeuft nur bei manuellem Start oder Tag-Push - macOS-Runner sind teurer in CI-Minuten
  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Init Templates
        # --org at.sbp  =>  applicationId "at.sbp.eye_pair_app".
        # Bewusst anders als die alte App (com.example.eye_pair_app), damit beide
        # Versionen parallel auf dem Handy installiert bleiben koennen.
        run: flutter create . --platforms=android,ios --org at.sbp --project-name=eye_pair_app

      - name: Install deps
        run: flutter pub get

      - name: Add iOS Bluetooth-Permission Keys
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'EyePair benoetigt Bluetooth fuer die Augen-Steuerung.'" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'EyePair benoetigt Bluetooth fuer die Augen-Steuerung.'" ios/Runner/Info.plist || true

      - name: Set iOS display name
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'SBP Eye Settings'" $PLIST || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'SBP Eye Settings'" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'SBP Eye Settings'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" $PLIST

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign

      - name: Package .ipa Payload
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr eye_pair_app-unsigned.ipa Payload
          ls -la

      - name: Upload IPA als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: eye_pair_app-ios-unsigned
          path: build/ios/iphoneos/eye_pair_app-unsigned.ipa

  # ============ Web Build + GitHub Pages ============
  # NUR fuer iOS gedacht. Safari kann kein Web Bluetooth (caniuse: "Safari on iOS
  # and iPadOS has no native support"), und weil Apple fuer alle iOS-Browser
  # WebKit vorschreibt, hilft dort auch Chrome nicht. Die Seite ist fuer Helfer
  # aus dem App Store gedacht - Bluefy oder die Safari-Erweiterung iOSWebBLE -,
  # die navigator.bluetooth auf CoreBluetooth umleiten. Das erspart Sideload,
  # die 7-Tage-Signatur und den bezahlten Entwicklerzugang.
  #
  # Fuer Android bleibt es bei der APK: die kann Signalstaerke, Adapterzustand
  # und die volle Paketgroesse beim Upload, was ueber Web Bluetooth alles fehlt.
  web:
    name: Build Web + Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write          # noetig zum Veroeffentlichen
      id-token: write       # noetig fuer deploy-pages
    # Zwei dicht aufeinanderfolgende Pushes wuerden sonst gleichzeitig
    # veroeffentlichen wollen und einer davon scheitern. cancel-in-progress
    # bleibt aus: eine halb abgebrochene Veroeffentlichung waere schlimmer
    # als eine, die kurz wartet.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Init Web-Template
        # Wie bei Android und iOS: die Plattform-Vorlage liegt nicht im Repo,
        # sie wird bei jedem Lauf neu erzeugt.
        run: flutter create . --platforms=android,ios,web --org at.sbp --project-name=eye_pair_app

      - name: Install deps
        run: flutter pub get

      - name: Version von flutter_blue_plus pruefen
        # Web-Unterstuetzung gibt es erst ab 1.35.0. Die Angabe in pubspec.yaml
        # lautet ^1.34.5 und erlaubt das - aber wenn hier doch 1.34.x steht,
        # waere der ganze Versuch sinnlos, und zwar ohne sichtbaren Fehler:
        # die Seite baut, nur Bluetooth fehlt. Deshalb hart abbrechen.
        run: |
          VER=$(flutter pub deps --style=compact 2>/dev/null \
                | grep -oE 'flutter_blue_plus [0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 | awk '{print $2}')
          echo "flutter_blue_plus = ${VER:-nicht gefunden}"
          if [ -z "$VER" ]; then echo "::error::Version nicht ermittelbar"; exit 1; fi
          MAJ=${VER%%.*}; REST=${VER#*.}; MIN=${REST%%.*}
          if [ "$MAJ" -lt 2 ] && [ "$MIN" -lt 35 ]; then
            echo "::error::flutter_blue_plus $VER kann kein Web - noetig ist >= 1.35.0"
            exit 1
          fi

      - name: Fassung in app_version.dart gegen pubspec.yaml pruefen
        # Eine angezeigte Fassung, die luegt, waere schlimmer als gar keine -
        # sie ist genau dann im Weg, wenn man ihr am meisten glauben moechte.
        run: |
          PUB=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          DART=$(grep -oE "kAppVersion = '[^']+'" lib/app_version.dart \
                 | sed "s/.*'\(.*\)'/\1/")
          echo "pubspec=$PUB  app_version.dart=$DART"
          if [ "$PUB" != "$DART" ]; then
            echo "::error::kAppVersion ($DART) passt nicht zu pubspec.yaml ($PUB)"
            exit 1
          fi

      - name: Build Web
        # base-href: Pages liefert unter /<repo>/ aus. Ohne diesen Pfad sucht die
        # Seite ihre Dateien in der Wurzel und bleibt weiss.
        #
        # pwa-strategy=none: KEIN Service Worker. Flutter registriert sonst einen,
        # der die App offline vorhaelt - und beim Neuladen zuerst die ALTE Fassung
        # ausliefert, waehrend die neue im Hintergrund geholt wird. Sichtbar wird
        # sie dann fruehestens beim uebernaechsten Start. Beim Suchen eines Fehlers
        # ist das verheerend: man testet den Stand von vorgestern und haelt das
        # Ergebnis fuer das der eben veroeffentlichten Fassung. Offline nuetzt die
        # Seite ohnehin nichts, sie braucht ein Auge in Funkreichweite.
        run: flutter build web --release --pwa-strategy=none --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Pages einrichten
        # enablement: true schaltet Pages beim ersten Lauf selbst ein - die
        # Einstellung war im Repo noch nie gesetzt.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Veroeffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
